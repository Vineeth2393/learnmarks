[project]
name = "learnmarks"
version = "0.1.0"
description = "Personal learning bookmark manager — local web backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "pydantic>=2.7",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=8",
]

[project.scripts]
learnmarks = "learnmarks.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["learnmarks"]

[tool.pytest.ini_options]
testpaths = ["tests"]
